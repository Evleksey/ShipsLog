<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="yard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe7ec"/>
      <stop offset="1" stop-color="#c6d2da"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2bd66"/>
      <stop offset="1" stop-color="#a8842f"/>
    </linearGradient>
    <path id="blade" d="M0-34C-74-66-86-176-10-200C56-204 76-108 0-34z" fill="url(#bronze)" stroke="#8a6a22" stroke-width="3"/>
  </defs>
  <rect width="800" height="600" fill="url(#yard)"/>
  <rect y="548" width="800" height="52" fill="#c9c2b3"/>

  <!-- Underside of the hull and the strut that carries the shaft -->
  <path d="M0 0h800v56q-400 70-800 30z" fill="#1f5a82"/>
  <path d="M388 70h62l-12 204h-36z" fill="#a8842f"/>
  <rect x="390" y="266" width="58" height="68" rx="10" fill="#8a6a22"/>

  <!-- Shaft with a new zinc anode clamped around it -->
  <rect y="286" width="560" height="28" fill="#b9c3ca"/>
  <rect y="290" width="560" height="6" fill="#dfe5ea"/>
  <rect x="236" y="266" width="84" height="68" rx="16" fill="#eef1f3" stroke="#9aa9b3" stroke-width="3"/>
  <path d="M278 266v68" stroke="#9aa9b3" stroke-width="3"/>
  <circle cx="257" cy="300" r="7" fill="#7f8c97"/>
  <circle cx="299" cy="300" r="7" fill="#7f8c97"/>

  <!-- Three-bladed propeller -->
  <g transform="translate(570 300)">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(240)"/>
    <circle r="46" fill="#b8902f" stroke="#8a6a22" stroke-width="3"/>
    <circle r="23" fill="#8a6a22"/>
    <circle cx="-7" cy="-7" r="7" fill="#d9b25a"/>
  </g>
</svg>

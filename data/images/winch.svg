  <rect x="384" y="140" width="32" height="14" rx="3" fill="#55626e"/>

  <!-- Tail of the sheet, and the winch handle on deck -->
  <path d="M486 224q90 6 120 110q24 90 194 96" fill="none" stroke="#f4f1e8" stroke-width="22"/>
  <path d="M486 224q90 6 120 110q24 90 194 96" fill="none" stroke="#c8452f" stroke-width="6" stroke-dasharray="6 22"/>
  <rect x="150" y="508" width="200" height="20" rx="10" fill="#b9c3ca" stroke="#7f8c97" stroke-width="2"/>
  <rect x="150" y="480" width="28" height="64" rx="11" fill="#1c2227"/>
  <rect x="330" y="500" width="34" height="36" rx="6" fill="#8d99a3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="locker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d8"/>
      <stop offset="1" stop-color="#ddd2ba"/>
    </linearGradient>
    <!-- One battery: case, lid, label, two terminal posts -->
    <g id="cell">
      <rect y="50" width="240" height="200" rx="10" fill="#2b3640"/>
      <rect x="-8" y="30" width="256" height="36" rx="8" fill="#3a4753"/>
      <rect x="30" y="104" width="180" height="96" rx="4" fill="#f0c330"/>
      <rect x="46" y="120" width="96" height="14" rx="2" fill="#2b3640"/>
      <rect x="46" y="146" width="148" height="8" rx="2" fill="#8a6f14"/>
      <rect x="46" y="162" width="110" height="8" rx="2" fill="#8a6f14"/>
      <rect x="34" y="4" width="30" height="30" rx="4" fill="#b9c3ca"/>
      <rect x="176" y="4" width="30" height="30" rx="4" fill="#b9c3ca"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#locker)"/>
  <rect y="446" width="800" height="154" fill="#c9b58e"/>
  <path d="M0 446h800" stroke="#b09a70" stroke-width="3"/>
  <ellipse cx="330" cy="452" rx="290" ry="12" fill="#000" opacity=".14"/>

  <use href="#cell" x="70" y="198"/>
  <use href="#cell" x="350" y="198"/>

  <!-- Link cables: positive to positive, negative to negative -->
  <path d="M119 212q0-66 140-66t140 66" fill="none" stroke="#c8452f" stroke-width="13" stroke-linecap="round"/>
  <path d="M261 212q0-34 140-34t140 34" fill="none" stroke="#1c2227" stroke-width="13" stroke-linecap="round"/>
  <rect x="98" y="198" width="42" height="24" rx="6" fill="#c8452f"/>
  <rect x="378" y="198" width="42" height="24" rx="6" fill="#c8452f"/>
  <rect x="240" y="198" width="42" height="24" rx="6" fill="#1c2227"/>
  <rect x="520" y="198" width="42" height="24" rx="6" fill="#1c2227"/>

  <!-- Hold-down strap -->
  <rect x="50" y="270" width="560" height="16" fill="#55626e"/>
  <rect x="300" y="264" width="42" height="28" rx="4" fill="#27323b"/>

  <!-- Multimeter, its probes resting on the locker floor -->
  <path d="M660 560q-50 30-130 6q-70-22-150-2" fill="none" stroke="#c8452f" stroke-width="5" stroke-linecap="round"/>
  <path d="M700 560q-70 50-170 24q-90-24-190-6" fill="none" stroke="#1c2227" stroke-width="5" stroke-linecap="round"/>
  <path d="M380 564l-62 8" stroke="#c8452f" stroke-width="11" stroke-linecap="round"/>
  <path d="M340 578l-62 9" stroke="#1c2227" stroke-width="11" stroke-linecap="round"/>
  <path d="M318 572l-34 4M278 587l-34 5" stroke="#b9c3ca" stroke-width="4" stroke-linecap="round"/>
  <rect x="622" y="362" width="138" height="204" rx="16" fill="#f0c330" stroke="#b78e12" stroke-width="4"/>
  <rect x="640" y="382" width="102" height="56" rx="6" fill="#d4e5d2" stroke="#8a9c88" stroke-width="2"/>
  <text x="691" y="424" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#1c2227">12.7</text>
  <circle cx="691" cy="502" r="38" fill="#2b3640"/>
  <path d="M691 502l-18-22" stroke="#f7f4ec" stroke-width="6" stroke-linecap="round"/>

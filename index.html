<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A ship's log for inspections, services and repairs — one log per boat.">
  <title>Ship’s Log</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Icons, drawn on a 24×24 grid and used through <use href="#icon-…">. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-anchor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="icon-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
    <symbol id="icon-marker" viewBox="0 0 24 24"><path d="M12 22.5S4.5 15.6 4.5 9.8a7.5 7.5 0 0 1 15 0c0 5.8-7.5 12.7-7.5 12.7z" fill="currentColor" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="9.8" r="2.8" fill="#fff" stroke="none"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <svg class="brand__mark icon" aria-hidden="true"><use href="#icon-anchor"/></svg>
        <span class="brand__name">Ship’s Log</span>
      </div>
      <div class="boat-picker">
        <label class="boat-picker__label" for="boat-select">Boat</label>
        <select class="boat-picker__select" id="boat-select" disabled></select>
      </div>
      <div class="topbar__actions" id="data-menu"></div>
    </div>
  </header>

  <main class="page" id="main">
    <p class="page__status" id="status" role="status">Opening the log…</p>
    <section id="boat-panel" aria-label="Boat" hidden></section>
    <section class="log" id="log-panel" aria-labelledby="log-heading" hidden></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="dialog dialog--wide" id="entry-dialog" aria-labelledby="entry-dialog-title"></dialog>
  <dialog class="dialog" id="form-dialog" aria-labelledby="form-dialog-title"></dialog>
  <dialog class="dialog" id="settings-dialog" aria-labelledby="settings-dialog-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="page__status page__status--error">Ship’s Log needs JavaScript to open the log.</p></noscript>
</body>
</html>
